<header class="header">
  <div class="header-inner">
    <a routerLink="/" class="brand" aria-label="MC Discovery home">
      <svg class="logo" viewBox="0 0 16 16" aria-hidden="true">
        <rect width="16" height="16" rx="3" fill="#4caf50" />
        <rect y="10" width="16" height="6" rx="0" fill="#8d6e63" />
        <rect y="13" width="16" height="3" rx="0" fill="#6d4c41" />
        <rect x="2" y="10" width="3" height="2" fill="#4caf50" />
        <rect x="9" y="10" width="2" height="3" fill="#4caf50" />
        <circle cx="11.5" cy="5" r="2.2" fill="none" stroke="#fff" stroke-width="1.2" />
        <path d="M13 6.6 14.6 8.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round" />
      </svg>
      <span>MC Discovery</span>
    </a>
    <nav aria-label="Main">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      }
    </nav>
    <button
      type="button"
      class="theme-toggle"
      (click)="theme.cycle()"
      [matTooltip]="themeLabel()"
      [attr.aria-label]="themeLabel()"
    >
      @switch (theme.mode()) {
        @case ('light') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"
            />
          </svg>
        }
        @case ('dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        }
      }
    </button>
  </div>
</header>
<main><router-outlet /></main>
<footer>

  · <a routerLink="/about">About &amp; credits</a>
</footer>
