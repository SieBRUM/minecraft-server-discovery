# Build and test everything. Nothing in CI scans real networks: the scanner tests only talk to fake
# servers on 127.0.0.1.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Check EF Core migrations are up to date
        if: runner.os == 'Linux'
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/McDiscovery.Core --startup-project src/McDiscovery.Core --no-build --configuration Release
      - name: Test
        run: dotnet test --no-build -c Release

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npx ng test
      - name: Production build
        run: npx ng build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: mcdiscovery-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build scanner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/scanner.Dockerfile
          push: false
          load: true
          tags: mcdiscovery-scanner:ci
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner
      - name: Smoke test images
        run: |
          # masscan runs as the unprivileged user thanks to file capabilities (needs the same caps as docker-compose.yml)
          # (masscan --version exits 1 even on success, so check its output instead)
          out=$(docker run --rm --cap-drop ALL --cap-add NET_RAW --cap-add NET_ADMIN --entrypoint masscan mcdiscovery-scanner:ci --version 2>&1 || true)
          echo "$out"
          grep -q 'Masscan version' <<<"$out"
          docker run --rm --entrypoint sh mcdiscovery-scanner:ci -c 'ls /usr/lib/*/libpcap.so*'
          docker run --rm mcdiscovery-scanner:ci scan --targets 192.0.2.1 --dry-run --geoip-update=false
          docker run -d --name api -p 127.0.0.1:18080:8080 -e MCD_ALLOWED_NETWORKS=0.0.0.0/0 mcdiscovery-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/stats > /dev/null
          page=$(curl -fsS http://127.0.0.1:18080/servers)
          grep -q '<app-root>' <<<"$page"
          headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:18080/api/health)
          grep -qi '^content-security-policy:' <<<"$headers"
          docker rm -f api
